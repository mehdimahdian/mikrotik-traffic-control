name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation (type of business, size of network) rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: router
    attributes:
      label: Would it change the router?
      options:
        - label: Yes - it would need new router-side objects (they must be previewed, tagged `mtc-`, backed up and removable)
